services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: billing
      MYSQL_USER: billing
      MYSQL_PASSWORD: billing
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubilling", "-pbilling"]
      interval: 5s
      timeout: 3s
      retries: 20
