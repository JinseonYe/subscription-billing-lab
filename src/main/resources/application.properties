spring.application.name=billing

# 스키마는 Flyway가 만든다. Hibernate는 엔티티와 스키마가 맞는지 검증만 한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# 결제사(토스페이먼츠). 비밀키는 환경변수로만 받는다. 기본값이 비어 있으면 호출 시점에 실패한다.
pg.toss.base-url=https://api.tosspayments.com
pg.toss.secret-key=${TOSS_SECRET_KEY:}
pg.toss.connect-timeout=3s
pg.toss.read-timeout=65s
